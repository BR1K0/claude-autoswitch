name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite needs only the standard library; tests that need macOS (Swift, OCR, Accessibility) or a POSIX
      # shell skip themselves elsewhere.
      - name: Python tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
      - name: PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in 'install.ps1', 'uninstall.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "${f}: $($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

  plugin:
    name: plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code
      # validate and test run locally against the plugin's files and the testing kit; no login is needed
      - name: claude plugin validate
        run: claude plugin validate plugin/autoswitch-inline
      - name: claude plugin test
        run: claude plugin test plugin/autoswitch-inline
